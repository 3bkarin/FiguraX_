<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" data-i18n="meta.description" content="FIGURAX - منتجات مطبوعة ثلاثية الأبعاد">
  <title data-i18n="meta.titleProducts">المنتجات - FIGURAX Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/customer.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="icon" href="assets/favicon.png">
  <link rel="stylesheet" href="assets/css/figurax-theme.css">
</head>
<body>
  <a href="#main-content" class="skip-link" data-i18n="common.skipToContent">الانتقال للمحتوى الرئيسي</a>

  <header class="header" role="banner">
  <div class="header-inner">
    <button class="mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="فتح القائمة" aria-expanded="false" aria-controls="sideMenu">
      <i class="fa-solid fa-bars" aria-hidden="true"></i>
    </button>

    <a href="index.html" class="header-logo" aria-label="FIGURAX - الرئيسية">
      <span class="brand-wordmark">FIGURAX</span>
    </a>

    <div class="header-actions">
      <div class="language-control" aria-label="تغيير اللغة">
        <span class="lang-text" id="languageLabel">English</span>
        <label class="viking-toggle" aria-label="تبديل اللغة">
          <input type="checkbox" class="viking-toggle__checkbox" id="languageToggle" />
          <div class="viking-toggle__track">
            <div class="viking-toggle__chain viking-toggle__chain--left"></div>
            <div class="viking-toggle__chain viking-toggle__chain--right"></div>
            <div class="viking-toggle__inner">
              <span class="viking-toggle__runes">ᛟ ᛏ ᛞ ᛁ ᚾ</span>
            </div>
            <div class="viking-toggle__glow"></div>
            <div class="viking-toggle__embers">
              <span class="viking-toggle__ember"></span>
              <span class="viking-toggle__ember"></span>
              <span class="viking-toggle__ember"></span>
              <span class="viking-toggle__ember"></span>
            </div>
            <svg class="viking-toggle__icon viking-toggle__icon--left" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M6.92 5L5 6.92l5.79 5.79L4.5 19H8l4-4 3.08 3.08L16.92 19l-5.79-5.79L18 6.5V3l-6.29 6.29L6.92 5z"></path>
            </svg>
            <svg class="viking-toggle__icon viking-toggle__icon--right" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M12 2L2 7l3 2-3 6 6-2 4 9 4-9 6 2-3-6 3-2-10-5zm0 4l4 2-4 8-4-8 4-2z"></path>
            </svg>
            <div class="viking-toggle__knob"><div class="viking-toggle__shield"></div></div>
          </div>
        </label>
      </div>

      <a href="cart.html" class="cart-btn" aria-label="عربة التسوق">
        <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
        <span class="cart-count" id="cartCount" aria-hidden="true">0</span>
      </a>
    </div>
  </div>
</header>

<div class="side-menu-overlay" id="sideMenuOverlay" hidden></div>
<aside class="side-menu" id="sideMenu" aria-hidden="true" aria-label="القائمة الرئيسية">
  <div class="side-menu-header">
    <span class="side-menu-title">FIGURAX</span>
    <button class="side-menu-close" id="sideMenuClose" type="button" aria-label="إغلاق القائمة">
      <i class="fa-solid fa-xmark" aria-hidden="true"></i>
    </button>
  </div>
  <nav class="side-menu-nav" aria-label="التنقل الرئيسي">
    <a href="index.html" data-i18n="nav.home"><i class="fa-solid fa-house" aria-hidden="true"></i><span>الرئيسية</span></a>
    <a href="products.html" data-i18n="nav.products"><i class="fa-solid fa-box-open" aria-hidden="true"></i><span>المنتجات</span></a>
    <a href="cart.html" data-i18n="nav.cart"><i class="fa-solid fa-cart-shopping" aria-hidden="true"></i><span>العربة</span><span class="side-cart-count" id="sideCartCount">0</span></a>
  </nav>
</aside>

  <main id="main-content" role="main">
    <section class="section" aria-labelledby="products-title">
      <div class="container">
        <header class="section-header">
          <h1 id="products-title" class="section-title" data-i18n="nav.products">المنتجات</h1>
        </header>

        <div class="flex flex-wrap gap-md mb-lg" role="search" aria-label="فلترة المنتجات">
          <div class="flex-1" style="min-width:250px;">
            <label for="searchInput" class="visually-hidden" data-i18n="common.search">بحث</label>
            <input type="search" id="searchInput" class="form-input" placeholder="ابحث عن منتج..." aria-label="ابحث عن منتج">
          </div>
          <div style="min-width:200px;">
            <label for="categoryFilter" class="visually-hidden" data-i18n="product.category">تصفية حسب التصنيف</label>
            <select id="categoryFilter" class="form-select" aria-label="تصفية حسب التصنيف">
              <option value="" data-i18n="product.allCategories">جميع التصنيفات</option>
            </select>
          </div>
        </div>

        <div class="grid grid-auto" id="productsGrid" role="list" aria-label="قائمة المنتجات">
          <div class="flex-center" style="grid-column:1/-1;padding:var(--spacing-xl);">
            <div class="spinner" aria-hidden="true"></div>
            <p data-i18n="common.loading">جاري التحميل...</p>
          </div>
        </div>

        <div class="text-center mt-lg" id="emptyState" hidden>
          <i class="fa-solid fa-box-open" style="font-size:4rem;color:var(--color-text-muted);margin-bottom:var(--spacing-md);" aria-hidden="true"></i>
          <h3 data-i18n="common.noProductsFound">لم يتم العثور على منتجات</h3>
          <p data-i18n="common.tryDifferentSearch">جرب البحث بكلمات مختلفة أو اختر تصنيف آخر</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer" role="contentinfo">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2025 FIGURAX Store. <span data-i18n="common.allRights">جميع الحقوق محفوظة</span>.</p>
      </div>
    </div>
  </footer>

  <script type="module" src="assets/js/i18n.js"></script>
  <script type="module" src="assets/js/api.js"></script>
  <script type="module" src="assets/js/cart.js"></script>
  <script type="module" src="assets/js/common.js"></script>
  <script type="module" src="assets/js/products.js"></script>
</body>
</html>
